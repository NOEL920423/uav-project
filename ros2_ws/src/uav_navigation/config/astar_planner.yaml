astar_planner:
  ros__parameters:
    # Canonical output frame. Phase 2 rejects every other value.
    planning_frame: px4_ned
    # A* grid cell size [m].
    grid_resolution_m: 0.05
    # Dynamic-grid padding around endpoints and obstacles [m].
    grid_margin_m: 2.0
    # Horizontal physical radius of the UAV [m].
    uav_physical_radius_m: 0.18
    # Static obstacle margin added during grid planning [m].
    static_safety_margin_m: 0.13
    # Extra clearance required by continuous segment validation [m].
    minimum_segment_clearance_m: 0.07
    # Maximum distance used to recover a rounded occupied endpoint cell [m].
    endpoint_search_radius_m: 1.0
    # Ramer-Douglas-Peucker candidate tolerance [m].
    path_simplification_tolerance_m: 0.05
    # Maximum spacing in every published simplified/final path [m].
    maximum_waypoint_spacing_m: 1.30
    # Prefer grid routes near the exact start-to-goal segment.
    use_direct_path_bias: true
    # Direct-path proximity cost weight [dimensionless].
    direct_path_bias_weight: 0.07
    # Add a soft cost near planning envelopes.
    use_clearance_aware_cost: true
    # Distance over which the soft-clearance cost acts [m].
    soft_clearance_radius_m: 0.40
    # Soft-clearance cost weight [dimensionless].
    clearance_cost_weight: 0.25
    # Fixed height above the Isaac world origin [m].
    flight_altitude_m: 2.0
    # Ignore obstacles that can be safely overflown at the fixed altitude.
    enable_overfly_short_obstacles: true
    # Required vertical separation over an obstacle top [m].
    overfly_vertical_clearance_m: 0.35
    # Isaac-world to NED north position offset [m].
    ned_offset_x: 0.0
    # Isaac-world to NED east position offset [m].
    ned_offset_y: 0.0
    # Isaac-world to NED down position offset [m].
    ned_offset_z: 0.0
    # Second-search conservative occupancy addition [m].
    retry_extra_inflation_m: 0.07
    # Hard allocation guard for a dynamically generated grid [cells].
    maximum_grid_cells: 4000000
    # Phase 3 generates a candidate; final selection still validates it.
    enable_bspline: true
    # Requested degree, reduced to control_point_count - 1 for short paths.
    bspline_degree: 3
    # Maximum spatial spacing after arc-length resampling [m].
    bspline_sample_spacing_m: 0.08
    # Inclusive final candidate sample-count bounds.
    bspline_minimum_samples: 16
    bspline_maximum_samples: 1000
    # Circumcircle discrete curvature limit [1/m], not a dynamics claim.
    bspline_maximum_curvature: 8.0
    # Continuous validation clearance, never weaker than Phase 2 [m].
    bspline_minimum_clearance_m: 0.07
    # Exact endpoints are mandatory in Phase 3.
    bspline_preserve_endpoints: true
    # Inward margin applied only when explicit planning bounds exist [m].
    bspline_allowed_bounds_margin_m: 0.0
    # Reject crossings between non-adjacent candidate segments.
    bspline_reject_self_intersection: true
    # Only validated simplified A* controls are permitted in production.
    bspline_control_point_strategy: validated_simplified_path
    # ROS built-in clock selection. Offline tests use wall-backed ROS time.
    use_sim_time: false
